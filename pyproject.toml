[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raven-mining"
version = "0.1.0"
description = "Production-grade KAWPOW miner for Ravencoin using CUDA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pycuda>=2024.1",
    "cuda-python>=12.0.0",
    "nvidia-cuda-nvrtc-cu12>=12.0.0",
    "nvidia-cuda-runtime-cu12>=12.0.0",
    "nvidia-ml-py>=12.0.0",
]

[tool.setuptools]
py-modules = ["main", "gpu_manager"]
